<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161c" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Дефекты">
<title>Таблица дефектов</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1b2430;--mute:#6b7685;--line:#e2e6ec;--acc:#2563eb;--accsoft:#e8f0ff;--warn:#dc2626;--badbg:#fde8e8;--tot:#0f766e;--totbg:#e6f5f3;--priink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1a2029;--ink:#e8edf3;--mute:#93a0b1;--line:#2a323d;--acc:#6ea0ff;--accsoft:#1d2a44;--warn:#ff7b7b;--badbg:#3a1f22;--tot:#4fd1c0;--totbg:#173330;--priink:#0b1220}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
header{display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center;margin-bottom:14px}
h1{font-size:21px;margin:0;font-weight:650}
.sub{color:var(--mute);font-size:13px;display:flex;align-items:center;gap:6px;margin-top:3px}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:#aaa}
.dot.on{background:#16a34a}.dot.err{background:var(--warn)}
.datebox{font-weight:600;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:0 14px;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:active{transform:scale(.97)}
@media(hover:hover){button:hover{border-color:var(--acc)}}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--priink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));align-items:start}
.part,.tot{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
summary{display:block;list-style:none;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
summary::-webkit-details-marker{display:none}
.sm{display:flex;align-items:center;gap:10px;min-height:62px;padding:10px 14px}
.pt{flex:1;min-width:0}.pt b{display:block;font-size:16px}.pt small{color:var(--mute);font-variant-numeric:tabular-nums}
.pill{min-width:44px;text-align:center;padding:6px 10px;border-radius:999px;font-weight:700;background:var(--totbg);color:var(--tot);font-variant-numeric:tabular-nums}
.pill.bad{background:var(--badbg);color:var(--warn)}
.chev{flex:none;width:9px;height:9px;margin:0 4px 4px 2px;border:solid var(--mute);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .15s}
.part[open] .chev{transform:rotate(-135deg);margin:4px 4px 0 2px}
.body{padding:2px 14px 12px;border-top:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 4px}
label{display:block;font-size:13px;font-weight:600}
label small{display:block;color:var(--mute);font-weight:400}
.in{display:block;width:100%;height:48px;margin-top:4px;padding:0 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:18px;text-align:center;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.in::placeholder{color:var(--mute);opacity:.55}
.in:focus{outline:none;border-color:var(--acc);background:var(--accsoft);box-shadow:0 0 0 2px var(--acc)}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.lbl{flex:1;min-width:0;font-size:14px;line-height:1.25}
.lbl small{display:block;color:var(--mute);font-size:12px}
.stp{display:flex;align-items:center;gap:6px}
.stp button{width:48px;padding:0;font-size:26px;line-height:1}
.stp .in{width:62px;margin:0}
.tot{margin-top:12px;padding:4px 14px}
h2{font-size:15px;margin:10px 0 4px}
.tot div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.tot h2+div{border:0}
.tot b{color:var(--tot);font-variant-numeric:tabular-nums}
.tot .all{font-weight:700;font-size:16px}
.note{color:var(--mute);font-size:13px;margin:12px 2px 0}
#toast{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
@media(min-width:700px){header{grid-template-columns:1fr auto auto}.bar{grid-column:auto;display:flex}button{min-height:44px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Таблица дефектов</h1>
      <div class="sub"><span class="dot" id="dot"></span><span id="status">Сохраняется только на этом устройстве</span></div>
    </div>
    <span id="date" class="datebox"></span>
    <div class="bar">
      <button id="clear">Очистить день</button>
      <button class="pri" id="dl">Скачать Excel</button>
    </div>
  </header>
  <main id="list"></main>
  <section class="tot" id="sum"></section>
  <p class="note">Дата ставится автоматически при открытии страницы. Изменения сохраняются сразу; если подключена общая база, коллега видит их через пару секунд.</p>
</div>
<div id="toast"></div>

<script>
/* ===== НАСТРОЙКА ОБЩЕГО ДОСТУПА =====
   Вставьте сюда адрес Firebase Realtime Database, например:
   "https://my-project-default-rtdb.europe-west1.firebasedatabase.app"
   Если оставить пустым — данные хранятся только в браузере. */
const DB_URL = "";
const ROOM = "defects"; // название общей таблицы

const PARTS = [
  ["FSB Dr 左前靠背","402048760AA"],["FSB Pas 右前靠背","402048788AA"],
  ["FSC Dr 左前坐垫","402048772AA"],["FSC Pas 右前坐垫","402048795AA"],
  ["RSB 40% 四分靠背","402048843AA"],["RSB 60% 六分靠背","402048824AA"],
  ["RSC 100% 大坐垫","402048850AA"]
];
const DEFECTS = [
  ["repair","Некачественный ремонт","修补不良"],
  ["nowire","Отсутствие проволоки","漏钢丝"],
  ["skew","Перекос проволоки","钢丝歪斜"],
  ["tear","Разрыв","撕裂"],
  ["edge","Отслоение / перекос бортовой ленты","刺毛条脱落/歪斜"],
  ["fabric","Отсутствие нетканого материала","漏无纺布"],
  ["foam","Отслоение / вздутие поропласта","软海绵起翘/脱落"],
  ["clip","Отсутствие пластикового фиксатора","塑料卡扣漏放"]
];
const NUM = DEFECTS.map(d=>d[0]).concat(["selected"]);
const $ = s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const wideNow=()=>matchMedia("(min-width:900px)").matches;

let day = todayStr();
let data = {};           // {rowIndex:{field:value}}
const LS = "defects:";

/* ---------- построение: карточка на каждую деталь ---------- */
function build(){
  const num=(i,f)=>`<input class="in" data-r="${i}" data-f="${f}" inputmode="numeric" pattern="[0-9]*" placeholder="0" autocomplete="off">`;
  $("#list").innerHTML=PARTS.map((p,i)=>`<details class="part"${wideNow()||i===0?" open":""}>
  <summary><div class="sm"><span class="pt"><b>${p[0]}</b><small>${p[1]}</small></span><span class="pill" id="s${i}" title="Итого дефектов">0</span><i class="chev"></i></div></summary>
  <div class="body">
    <div class="two">
      <label>Партия<small>批次</small><input class="in" data-r="${i}" data-f="batch" autocomplete="off"></label>
      <label>Всего отобрано<small>挑选总数</small>${num(i,"selected")}</label>
    </div>
    ${DEFECTS.map(d=>`<div class="row"><span class="lbl">${d[1]}<small>${d[2]}</small></span>
      <span class="stp"><button type="button" data-d="-1" aria-label="Минус один">−</button>${num(i,d[0])}<button type="button" data-d="1" aria-label="Плюс один">+</button></span></div>`).join("")}
  </div></details>`).join("");
  $("#sum").innerHTML=`<h2>Всего за день · 合计</h2><div><span>Всего отобрано · 挑选总数</span><b id="t_selected">0</b></div>`
    +DEFECTS.map(d=>`<div><span>${d[1]} · ${d[2]}</span><b id="t_${d[0]}">0</b></div>`).join("")
    +`<div class="all"><span>Итого · 合计</span><b id="t_all">0</b></div>`;
}
const n=v=>parseFloat(v)||0;
function render(force){
  document.querySelectorAll("input[data-f]").forEach(el=>{
    if(!force && el===document.activeElement) return;
    const v=(data[el.dataset.r]||{})[el.dataset.f]||"";
    if(el.value!==String(v)) el.value=v;
  });
  totals();
}
function totals(){
  const t={all:0};NUM.forEach(k=>t[k]=0);
  PARTS.forEach((_,i)=>{
    const r=data[i]||{};let s=0;
    DEFECTS.forEach(d=>{s+=n(r[d[0]]);t[d[0]]+=n(r[d[0]])});
    t.selected+=n(r.selected);t.all+=s;
    const p=$("#s"+i);p.textContent=s;p.classList.toggle("bad",s>0);
  });
  Object.keys(t).forEach(k=>{const e=$("#t_"+k);if(e)e.textContent=t[k]});
}

/* ---------- хранение и синхронизация ---------- */
const url = p => DB_URL.replace(/\/$/,"")+"/"+ROOM+"/"+p+".json";
function setStatus(txt,cls){$("#status").textContent=txt;$("#dot").className="dot "+(cls||"")}
function localLoad(){try{return JSON.parse(localStorage.getItem(LS+day))||{}}catch(e){return {}}}
function localSave(){try{localStorage.setItem(LS+day,JSON.stringify(data))}catch(e){}}

let last=0; // время последней правки: чтобы опрос не затирал свежий ввод
async function pull(force){
  if(!DB_URL){data=localLoad();render(force);return}
  if(!force && Date.now()-last<4000) return;
  try{
    const r=await fetch(url(day));
    const j=await r.json();
    data=normalize(j);
    render(force);
    setStatus("Общая таблица · синхронизировано","on");
  }catch(e){setStatus("Нет связи с общей базой","err")}
}
function normalize(j){
  if(!j) return {};
  if(Array.isArray(j)){const o={};j.forEach((v,i)=>{if(v)o[i]=v});return o}
  return j;
}
const tm={};
function push(r,f,v){
  (data[r]=data[r]||{})[f]=v;last=Date.now();
  totals();localSave();
  if(!DB_URL) return;
  const d=day,k=r+"|"+f;clearTimeout(tm[k]);
  tm[k]=setTimeout(async()=>{ // небольшая задержка: быстрые нажатия +/− уходят одним запросом
    try{
      await fetch(url(d+"/"+r+"/"+f),{method:"PUT",body:JSON.stringify(v)});
      setStatus("Общая таблица · сохранено","on");
    }catch(e){setStatus("Не удалось сохранить в общую базу","err")}
  },250);
}

/* ---------- ввод ---------- */
const L=$("#list");
L.addEventListener("input",e=>{
  const el=e.target;if(!el.dataset.f)return;
  if(el.dataset.f!=="batch") el.value=el.value.replace(/\D/g,"");
  push(el.dataset.r,el.dataset.f,el.value);
});
L.addEventListener("click",e=>{
  const b=e.target.closest("button[data-d]");if(!b)return;
  const el=b.parentNode.querySelector("input");
  el.value=Math.max(0,n(el.value)+Number(b.dataset.d));
  push(el.dataset.r,el.dataset.f,el.value);
  if(navigator.vibrate)navigator.vibrate(8);
});
// при входе в поле выделяем содержимое — можно сразу вводить новое число
L.addEventListener("focusin",e=>{if(e.target.matches("input"))setTimeout(()=>e.target.select(),0)});
// на телефоне открыта одна деталь за раз; на широком экране — все сразу
L.addEventListener("toggle",e=>{
  const d=e.target;if(!d.open||wideNow())return;
  L.querySelectorAll("details[open]").forEach(o=>{if(o!==d)o.open=false});
  d.scrollIntoView({block:"start",behavior:"smooth"});
},true);
// у цифровой клавиатуры iPhone нет кнопки «Готово» — закрываем её по касанию вне полей
document.addEventListener("pointerdown",e=>{
  const a=document.activeElement;
  if(a&&a.matches("input")&&!e.target.closest("input,button"))a.blur();
});

/* ---------- дата ---------- */
function setDay(d){day=d;$("#date").textContent=d.split("-").reverse().join(".");pull(true)}
$("#clear").onclick=async()=>{
  if(!confirm("Очистить все данные за "+day+"?"))return;
  data={};localSave();render(true);
  if(DB_URL){try{await fetch(url(day),{method:"DELETE"})}catch(e){}}
};

/* ---------- скачивание ---------- */
function rows(){
  const head=["Дата 时间","Деталь 零部件","Номер детали 零件号","Партия 批次","Всего отобрано 挑选总数"]
    .concat(DEFECTS.map(d=>d[1]+" "+d[2]),["Итого 合计"]);
  const out=[head];
  PARTS.forEach((p,i)=>{
    const r=data[i]||{};let s=0;DEFECTS.forEach(d=>s+=n(r[d[0]]));
    out.push([day,p[0],p[1],r.batch||"",n(r.selected)].concat(DEFECTS.map(d=>n(r[d[0]])),[s]));
  });
  const tot=["","Всего","",""];let sel=0,all=0;const dsum=DEFECTS.map(()=>0);
  PARTS.forEach((_,i)=>{const r=data[i]||{};sel+=n(r.selected);DEFECTS.forEach((d,k)=>{dsum[k]+=n(r[d[0]]);all+=n(r[d[0]])})});
  out.push(tot.concat([sel],dsum,[all]));
  return out;
}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200)}
$("#dl").onclick=async()=>{
  const r=rows(),name="defects_"+day+".xlsx";
  if(window.XLSX){
    const ws=XLSX.utils.aoa_to_sheet(r);
    ws["!cols"]=r[0].map((_,i)=>({wch:i===1?20:i===2?15:16}));
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Дефекты");
    try{
      // на телефоне открываем меню «Поделиться»: сохранить в «Файлы» или отправить в мессенджер
      if(matchMedia("(pointer:coarse)").matches&&navigator.canShare){
        const f=new File([XLSX.write(wb,{type:"array",bookType:"xlsx"})],name,{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
        if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return toast("Файл готов")}
      }
    }catch(e){if(e&&e.name==="AbortError")return}
    XLSX.writeFile(wb,name);
  }else{
    const csv="\ufeff"+r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\r\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download="defects_"+day+".csv";a.click();
  }
  toast("Файл скачан");
};

/* ---------- старт ---------- */
build();setDay(todayStr());
if(DB_URL) setInterval(()=>pull(false),3000);
// при возврате на страницу (телефон усыпляет вкладки): новая дата или свежие данные
document.addEventListener("visibilitychange",()=>{
  if(document.hidden)return;
  if(day!==todayStr())setDay(todayStr());else if(DB_URL)pull(false);
});
</script>
</body>
</html>
